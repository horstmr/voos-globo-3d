<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globo 3D - Voos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: rgba(10, 14, 22, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f7f3e8;
      --muted: #aeb9c8;
      --cyan: #62e4ff;
      --green: #8df2ad;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    #globe {
      position: fixed;
      inset: 0;
      cursor: grab;
    }

    #globe:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      left: clamp(18px, 4vw, 56px);
      top: clamp(18px, 4vw, 48px);
      width: min(420px, calc(100vw - 36px));
      pointer-events: none;
      z-index: 2;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 0.94;
      font-weight: 760;
      letter-spacing: 0;
    }

    .lede {
      margin: 12px 0 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      pointer-events: auto;
    }

    button, select {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
      font-size: 13px;
      backdrop-filter: blur(16px);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    button:hover, button.active,
    select:hover, select:focus {
      border-color: rgba(98, 228, 255, 0.72);
      background: rgba(16, 28, 40, 0.78);
    }

    select {
      padding: 0 8px;
    }

    .status {
      position: fixed;
      right: clamp(14px, 3vw, 38px);
      bottom: clamp(14px, 3vw, 34px);
      width: min(320px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      z-index: 2;
    }

    .status strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--cyan);
    }

    .status span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      min-width: 0;
    }

    .metric b {
      display: block;
      color: var(--gold);
      font-size: 16px;
      line-height: 1;
    }

    .metric small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: rgba(247, 243, 232, 0.84);
      background: rgba(5, 7, 11, 0.62);
      backdrop-filter: blur(12px);
      font-size: 12px;
      pointer-events: none;
      z-index: 2;
    }

    .globe-tooltip {
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: rgba(5, 7, 11, 0.86);
      color: #fff;
      font-size: 11px;
      line-height: 1.35;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 720px) {
      h1 {
        font-size: 42px;
      }

      .lede {
        display: none;
      }

      .controls {
        margin-top: 10px;
      }

      button, select {
        min-height: 36px;
        padding: 0 10px;
        font-size: 12px;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="globe" aria-label="Globo 3D de voos"></main>

  <section class="hud" aria-label="Controles">
    <h1>Voos 3D</h1>
    <p class="lede">Martin R. Horst 2007–2026. Arraste para girar, role para zoom.</p>
    <div class="controls" id="controls">
      <select id="year-selector">
        <option value="">Selecione um ano...</option>
      </select>
      <button id="toggle-spin" class="active" type="button">Auto-giro ON</button>
      <button id="reset-view" type="button">Resetar câmera</button>
    </div>
  </section>

  <aside class="status" aria-live="polite">
    <strong id="selected-title">Rede global</strong>
    <span id="selected-copy" style="font-size:11px;color:var(--cyan);margin-bottom:8px;display:block"></span>
    <div class="metric-row">
      <div class="metric">
        <b id="metric-airports">0</b>
        <small>aeroportos</small>
      </div>
      <div class="metric">
        <b id="metric-routes">0</b>
        <small>rotas</small>
      </div>
      <div class="metric">
        <b id="metric-year">2007</b>
        <small>ano</small>
      </div>
    </div>
  </aside>

  <div class="hint">Arraste para girar · scroll/pinca para zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

tico","dt":"29/04/2018"},{"o":"POA","d":"PTY","y":2018,"t":"Intercontinental","dt":"30/04/2018"},{"o":"PTY","d":"GUA","y":2018,"t":"América Central","dt":"30/04/2018"},{"o":"PTY","d":"GRU","y":2018,"t":"Intercontinental","dt":"08/06/2018"},{"o":"GRU","d":"CWB","y":2018,"t":"Doméstico","dt":"09/06/2018"},{"o":"VCP","d":"JOI","y":2019,"t":"Doméstico"},{"o":"CWB","d":"GRU","y":2020,"t":"Doméstico","dt":"10/02/2020"},{"o":"GRU","d":"REC","y":2020,"t":"Doméstico","dt":"10/02/2020"},{"o":"REC","d":"GRU","y":2020,"t":"Doméstico","dt":"17/02/2020"},{"o":"GRU","d":"CWB","y":2020,"t":"Doméstico","dt":"17/02/2020"},{"o":"NVT","d":"GRU","y":2021,"t":"Doméstico"},{"o":"GRU","d":"BEL","y":2021,"t":"Doméstico","dt":"19/06/2021"},{"o":"BEL","d":"GRU","y":2021,"t":"Doméstico","dt":"23/06/2021"},{"o":"GRU","d":"NVT","y":2021,"t":"Doméstico","dt":"23/06/2021"},{"o":"CWB","d":"CNF","y":2022,"t":"Doméstico"},{"o":"CNF","d":"GYN","y":2022,"t":"Doméstico"},{"o":"GYN","d":"VCP","y":2022,"t":"Doméstico"},{"o":"VCP","d":"CWB","y":2022,"t":"Doméstico"},{"o":"CWB","d":"GRU","y":2023,"t":"Doméstico"},{"o":"GRU","d":"BOG","y":2023,"t":"Intercontinental"},{"o":"BOG","d":"CTG","y":2023,"t":"América do Sul"},{"o":"CTG","d":"MDE","y":2023,"t":"América do Sul","dt":"23/01/2023"},{"o":"MDE","d":"BOG","y":2023,"t":"América do Sul","dt":"23/01/2023"},{"o":"AXM","d":"BOG","y":2023,"t":"América do Sul"},{"o":"BOG","d":"UIO","y":2023,"t":"América do Sul"},{"o":"GYE","d":"GPS","y":2023,"t":"América do Sul","dt":"12/02/2023"},{"o":"SCY","d":"GYE","y":2023,"t":"América do Sul","dt":"15/02/2023"},{"o":"GYE","d":"LIM","y":2023,"t":"América do Sul","dt":"16/02/2023"},{"o":"LIM","d":"GRU","y":2023,"t":"Intercontinental","dt":"17/02/2023"},{"o":"GRU","d":"CWB","y":2023,"t":"Doméstico","dt":"17/02/2023"},{"o":"XAP","d":"CGH","y":2024,"t":"Doméstico"},{"o":"GRU","d":"XAP","y":2024,"t":"Doméstico"},{"o":"JOI","d":"VCP","y":2025,"t":"Doméstico"},{"o":"VCP","d":"NAT","y":2025,"t":"Doméstico"},{"o":"NAT","d":"CNF","y":2025,"t":"Doméstico"},{"o":"VCP","d":"JOI","y":2025,"t":"Doméstico"},{"o":"CNF","d":"VCP","y":2025,"t":"Doméstico"},{"o":"CWB","d":"GIG","y":2025,"t":"Doméstico"},{"o":"GIG","d":"AJU","y":2025,"t":"Doméstico"},{"o":"MCZ","d":"CGH","y":2025,"t":"Doméstico"},{"o":"CGH","d":"CWB","y":2025,"t":"Doméstico"},{"o":"CWB","d":"GIG","y":2026,"t":"Doméstico"},{"o":"GIG","d":"CWB","y":2026,"t":"Doméstico"}];

    const colorMap = {
      'Doméstico': '#8df2ad',
      'Transatlântico': '#62e4ff',
      'Europeu': '#ffd166',
      'Internacional': '#ff7aa2',
      'Regional/Ásia': '#8ab4ff',
      'Intercontinental': '#d7ff66',
      'América Central': '#ff9f66',
      'América do Sul': '#ffb347'
    };

    let currentYear = null;
    let currentType = null;
    let currentAirport = null;
    let spinning = true;

    const airportList = Object.entries(AP).map(([code, [lng, lat]]) => ({
      id: code, name: code, lat, lng,
      color: code === 'CWB' ? '#ffd166' : '#62e4ff'
    }));

    function apColor(code) {
      if (code === currentAirport) return '#ff6b35';
      if (code === 'CWB') return '#ffd166';
      return '#62e4ff';
    }

    function getRoutes() {
      // 1ª passagem: agrupa por rota DIRECIONAL (A→B ≠ B→A)
      const dir = new Map();
      FL.filter(f => {
        if (currentYear !== null && f.y !== currentYear) return false;
        if (currentType && f.t !== currentType) return false;
        if (currentAirport && f.o !== currentAirport && f.d !== currentAirport) return false;
        return true;
      }).forEach(f => {
        if (!AP[f.o] || !AP[f.d]) return;
        const key = `${f.o}→${f.d}`;
        const label = f.dt || String(f.y);
        if (!dir.has(key)) {
          dir.set(key, { o: f.o, d: f.d, tipo: f.t, dates: [label] });
        } else {
          const r = dir.get(key);
          if (!r.dates.includes(label)) r.dates.push(label);
        }
      });

      const pairCount = new Map();
      const ALT  = [0.28, 0.48, 0.65];
      const STRK = [0.55, 0.45, 0.38];

      return Array.from(dir.values()).map(({ o, d, tipo, dates }) => {
        const pair = [o, d].sort().join('-');
        const idx  = pairCount.get(pair) ?? 0;
        pairCount.set(pair, idx + 1);

        const [lng1, lat1] = AP[o];
        const [lng2, lat2] = AP[d];
        const datesStr = dates.join(' · ');

        return {
          startLat: lat1, startLng: lng1,
          endLat:   lat2, endLng:   lng2,
          color:    colorMap[tipo] || '#62e4ff',
          name:     `${o} → ${d}`,
          tipo, dates,
          altScale: ALT[Math.min(idx, ALT.length - 1)],
          stroke:   STRK[Math.min(idx, STRK.length - 1)],
          arcLabel: `<div class="globe-tooltip"><strong>${o} → ${d}</strong><br><span style="color:#aeb9c8;font-size:10px">${datesStr}</span></div>`
        };
      });
    }

    const globe = Globe()
      .backgroundColor('rgba(0,0,0,0)')
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereColor('#62e4ff')
      .atmosphereAltitude(0.14)
      .pointsData(airportList)
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude(0.025)
      .pointRadius(0.14)
      .pointResolution(12)
      .pointColor('color')
      .pointLabel(p => {
        const sel = currentAirport === p.id;
        return `<div class="globe-tooltip"><strong>${p.id}</strong><br><span style="color:${sel?'#ff6b35':'#aeb9c8'};font-size:10px">${sel?'✕ clique para limpar':'clique para filtrar'}</span></div>`;
      })
      .onPointClick(p => {
        currentAirport = currentAirport === p.id ? null : p.id;
        updateGlobe();
      })
      .arcsData(getRoutes())
      .arcColor('color')
      .arcLabel('arcLabel')
      .arcDashLength(0.4)
      .arcDashGap(0.15)
      .arcDashAnimateTime(2200)
      .arcAltitudeAutoScale('altScale')
      .arcStroke('stroke')
      (document.querySelector('#globe'));

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.35;
    globe.controls().enableDamping = true;
    globe.controls().dampingFactor = 0.08;
    globe.controls().minDistance = 140;
    globe.controls().maxDistance = 480;

    const selector = document.querySelector('#year-selector');
    // opção "Todos os anos" já existe no HTML como value=""
    selector.options[0].textContent = 'Todos os anos';
    selector.options[0].selected = true;
    for (let y = 2007; y <= 2026; y++) {
      const option = document.createElement('option');
      option.value = y;
      option.textContent = y;
      selector.appendChild(option);
    }

    selector.addEventListener('change', (e) => {
      currentYear = e.target.value ? parseInt(e.target.value) : null;
      updateGlobe();
    });

    function updateGlobe() {
      const routes = getRoutes();
      airportList.forEach(a => { a.color = apColor(a.id); });

      const airports = new Set(routes.flatMap(r => [
        airportList.find(a => a.lat === r.startLat && a.lng === r.startLng)?.id,
        airportList.find(a => a.lat === r.endLat && a.lng === r.endLng)?.id
      ]).filter(Boolean));

      globe.arcsData(routes).pointsData([...airportList]);
      document.querySelector('#metric-routes').textContent = routes.length;
      document.querySelector('#metric-airports').textContent = airports.size;
      document.querySelector('#metric-year').textContent = currentYear ?? 'Todos';

      if (currentAirport) {
        document.querySelector('#selected-title').textContent = `${currentAirport} — rotas`;
        document.querySelector('#selected-copy').textContent = `${routes.length} rotas · anos: ${[...new Set(FL.filter(f=>f.o===currentAirport||f.d===currentAirport).map(f=>f.y))].sort().join(', ')}`;
      } else {
        document.querySelector('#selected-title').textContent = currentYear ? `${currentYear}` : 'Rede global (2007–2026)';
        document.querySelector('#selected-copy').textContent = `${airports.size} aeroportos · ${routes.length} rotas`;
      }
    }

    const spinBtn = document.querySelector('#toggle-spin');
    spinBtn.addEventListener('click', (e) => {
      spinning = !spinning;
      globe.controls().autoRotate = spinning;
      e.target.classList.toggle('active', spinning);
      e.target.textContent = spinning ? 'Auto-giro ON' : 'Auto-giro OFF';
    });

    document.querySelector('#reset-view').addEventListener('click', () => {
      globe.pointOfView({ lat: -15, lng: -45, altitude: 2.1 }, 1000);
    });

    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && currentAirport) {
        currentAirport = null;
        updateGlobe();
      }
    });

    globe.width(window.innerWidth).height(window.innerHeight);
    globe.pointOfView({ lat: -15, lng: -45, altitude: 2.1 }, 0);
    updateGlobe();
  </script>
</body>
</html>
